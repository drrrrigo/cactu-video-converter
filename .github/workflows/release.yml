name: Cactu beta candidate and release
on:
  push:
    tags: ['v*-beta.*']
  workflow_dispatch:
    inputs:
      candidate_stage:
        description: Audit-only build or technically reviewed private RC1
        type: choice
        options: [audit, rc1]
        default: audit
permissions:
  contents: read
  actions: read
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-2025
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config cmake ninja-build meson libfontconfig1-dev libfreetype6-dev libfribidi-dev libharfbuzz-dev libva-dev zlib1g-dev libbz2-dev liblzma-dev bubblewrap libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 fonts-dejavu-core
      - run: "python -m pip install --require-hashes --only-binary=:all: -r release/requirements.lock"
      - run: python scripts/audit_source.py --history
      - run: python scripts/stage_ffmpeg.py ${{ matrix.target }}
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys
        with:
          msystem: UCRT64
          update: true
          install: >-
            python make autoconf automake libtool mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-fontconfig
            mingw-w64-ucrt-x86_64-freetype mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-harfbuzz mingw-w64-ucrt-x86_64-libunibreak
            mingw-w64-ucrt-x86_64-bzip2 mingw-w64-ucrt-x86_64-xz
            mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-meson
      - if: runner.os == 'Windows'
        name: Acquire locked sources using native Windows Python
        shell: pwsh
        run: '& "$env:pythonLocation\python.exe" scripts/acquire_controlled_ffmpeg.py windows-x86_64'
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          /usr/bin/python scripts/build_controlled_ffmpeg.py windows-x86_64 --jobs 4 --environment-profile windows-2025-ucrt64
          /usr/bin/python scripts/collect_msys_native_evidence.py / build/msys-attribution
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @("${{ steps.msys.outputs.msys2-location }}\ucrt64\bin", $env:pythonLocation, "$env:pythonLocation\Scripts") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - if: runner.os == 'Linux'
        run: |
          python scripts/acquire_controlled_ffmpeg.py linux-x86_64
          python scripts/build_controlled_ffmpeg.py linux-x86_64 --jobs 4 --environment-profile ubuntu-22.04-gcc
      - run: python scripts/validate_controlled_ffmpeg.py build/ffmpeg-controlled/prefix/bin build/ffmpeg-controlled/compatibility.json
      - run: python scripts/install_packaging_tool.py
      - run: python scripts/build_release.py ${{ inputs.candidate_stage == 'rc1' && '--rc1' || '--candidate' }}
      # Text-only evidence is safe to review while binaries remain unapproved.
      # These reports contain package-relative paths, hashes and component metadata.
      - name: Retain audit reports (no binaries)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Audit-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/candidate/*.json
            dist/candidate/*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      # Even Actions artifacts from a public repo are distribution. Do not upload
      # candidate binaries until the corresponding-source/license gates are clear.
      - name: Verify distribution eligibility
        run: python scripts/release_policy.py --distribution
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cactu-${{ matrix.target }}-${{ github.sha }}
          path: dist/candidate/*
          if-no-files-found: error
          retention-days: 14
  verify-candidate:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-2025
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      BETA_CANDIDATE_RUN_ID: ${{ vars.BETA_CANDIDATE_RUN_ID }}
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.7'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 fonts-dejavu-core
      - run: python scripts/check_candidate_run.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Cactu-${{ matrix.target }}-${{ github.sha }}
          run-id: ${{ vars.BETA_CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}
          path: dist/candidate
      - run: python scripts/promote_smoke.py dist/candidate
      - run: python scripts/release_policy.py --distribution
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Verified-${{ matrix.target }}-${{ github.sha }}
          path: dist/candidate/*
          if-no-files-found: error
  publish:
    needs: verify-candidate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: public-beta
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.7'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Verified-*
          merge-multiple: true
          path: dist/release
      - name: Validate exact tag and final evidence
        env:
          BETA_MANUAL_EVIDENCE: ${{ vars.BETA_MANUAL_EVIDENCE }}
          BETA_OWNER_APPROVAL: ${{ vars.BETA_OWNER_APPROVAL }}
        run: python scripts/release_policy.py --publish --artifacts dist/release
      # A separately reviewed, same-commit source set is mandatory. No unapproved
      # source archive is automatically uploaded by a candidate build.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Approved-sources-${{ github.sha }}
          path: dist/release
      - name: Validate corresponding-source asset hashes and approval
        run: python -c "from pathlib import Path; import sys; sys.path.insert(0, 'scripts'); from source_assets import source_assets; source_assets(Path('dist/release'))"
      - run: python scripts/checksums.py dist/release
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py dist/release
