name: Cactu beta candidate and release
on:
  push:
    tags: ['v*-beta.*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-2025
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.7'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 fonts-dejavu-core
      - run: python -m pip install -r release/requirements.txt
      - run: python scripts/audit_source.py --history
      - run: python scripts/stage_ffmpeg.py ${{ matrix.target }}
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: python scripts/install_packaging_tool.py
      - run: python scripts/build_release.py --candidate
      # Even Actions artifacts from a public repo are distribution. Do not upload
      # candidate binaries until the corresponding-source/license gates are clear.
      - name: Verify distribution eligibility
        run: python scripts/release_policy.py --distribution
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cactu-${{ matrix.target }}-${{ github.sha }}
          path: dist/candidate/*
          if-no-files-found: error
          retention-days: 14
  verify-candidate:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-2025
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      BETA_CANDIDATE_RUN_ID: ${{ vars.BETA_CANDIDATE_RUN_ID }}
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.7'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 fonts-dejavu-core
      - run: python scripts/check_candidate_run.py
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Cactu-${{ matrix.target }}-${{ github.sha }}
          run-id: ${{ vars.BETA_CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}
          path: dist/candidate
      - run: python scripts/promote_smoke.py dist/candidate
      - run: python scripts/release_policy.py --distribution
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Verified-${{ matrix.target }}-${{ github.sha }}
          path: dist/candidate/*
          if-no-files-found: error
  publish:
    needs: verify-candidate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment: public-beta
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.7'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Verified-*
          merge-multiple: true
          path: dist/release
      - name: Validate exact tag and final evidence
        env:
          BETA_MANUAL_EVIDENCE: ${{ vars.BETA_MANUAL_EVIDENCE }}
        run: python scripts/release_policy.py --publish --artifacts dist/release
      - run: python scripts/checksums.py dist/release
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py dist/release
