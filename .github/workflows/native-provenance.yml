name: Native dependency provenance (metadata only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.7'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: >-
            python make autoconf automake libtool
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libass mingw-w64-ucrt-x86_64-libvpl
            mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-meson
      - name: Attribute DLLs and retain exact installed notices
        shell: pwsh
        run: '& "$env:pythonLocation\python.exe" scripts/collect_msys_native_evidence.py "${{ steps.msys.outputs.msys2-location }}" build/native-provenance'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Windows-native-provenance-${{ github.sha }}
          path: build/native-provenance
          if-no-files-found: error
