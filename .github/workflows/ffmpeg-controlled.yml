name: FFmpeg native bootstrap (unapproved)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Bootstrap only: package versions/hashes must be retained and replay-locked
      # before this environment is eligible for a release build.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            python make autoconf automake libtool
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libass
            mingw-w64-ucrt-x86_64-libvpl
      - name: Record bootstrap package versions
        shell: msys2 {0}
        run: |
          mkdir -p build/ffmpeg-controlled
          pacman -Q > build/ffmpeg-controlled/packages.txt
      - name: Acquire exact source inputs
        shell: msys2 {0}
        run: /usr/bin/python scripts/acquire_controlled_ffmpeg.py windows-x86_64
      - name: Build native Windows candidate
        shell: msys2 {0}
        run: /usr/bin/python scripts/build_controlled_ffmpeg.py windows-x86_64 --jobs 4
      - name: Native software conversion
        shell: msys2 {0}
        run: >-
          build/ffmpeg-controlled/prefix/bin/ffmpeg.exe -hide_banner -nostdin
          -f lavfi -i testsrc2=s=160x90:d=1
          -f lavfi -i sine=d=1 -c:v libx264 -pix_fmt yuv420p
          -c:a aac -movflags +faststart build/ffmpeg-controlled/software.mp4
      - name: Retain metadata only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: FFmpeg-Windows-bootstrap-${{ github.sha }}
          path: |
            build/ffmpeg-controlled/manifest.json
            build/ffmpeg-controlled/environment.json
            build/ffmpeg-controlled/packages.txt
            build/ffmpeg-controlled/logs/*.log
          if-no-files-found: warn
