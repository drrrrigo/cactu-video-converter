name: FFmpeg native bootstrap (unapproved)
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native target to validate
        type: choice
        default: both
        options: [both, windows, linux]
permissions:
  contents: read
jobs:
  windows:
    if: inputs.target != 'linux'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Bootstrap only: package versions/hashes must be retained and replay-locked
      # before this environment is eligible for a release build.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        id: msys
        with:
          msystem: UCRT64
          update: true
          install: >-
            python make autoconf automake libtool
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-fontconfig
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-libunibreak
            mingw-w64-ucrt-x86_64-bzip2
            mingw-w64-ucrt-x86_64-xz
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-meson
      - name: Record bootstrap package versions
        shell: msys2 {0}
        run: |
          mkdir -p build/ffmpeg-controlled
          pacman -Q > build/ffmpeg-controlled/packages.txt
      - name: Acquire exact source inputs
        shell: msys2 {0}
        run: /usr/bin/python scripts/acquire_controlled_ffmpeg.py windows-x86_64
      - name: Build native Windows candidate
        shell: msys2 {0}
        run: /usr/bin/python scripts/build_controlled_ffmpeg.py windows-x86_64 --jobs 4 --environment-profile windows-2025-ucrt64
      - name: Native software conversion
        shell: msys2 {0}
        run: >-
          build/ffmpeg-controlled/prefix/bin/ffmpeg.exe -hide_banner -nostdin
          -f lavfi -i testsrc2=s=160x90:d=1
          -f lavfi -i sine=d=1 -c:v libx264 -pix_fmt yuv420p
          -c:a aac -movflags +faststart build/ffmpeg-controlled/software.mp4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.7'
      - name: Expose native candidate dependency directory
        shell: pwsh
        run: |
          @("${{ steps.msys.outputs.msys2-location }}\ucrt64\bin", $env:pythonLocation, "$env:pythonLocation\Scripts") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify canonical native Python wins over MSYS2
        run: python -c "import os, sys; from pathlib import Path; assert sys.version_info[:3] == (3,14,7); assert Path(sys.executable).resolve() == (Path(os.environ['pythonLocation']) / 'python.exe').resolve()"
      - run: "python -m pip install --require-hashes --only-binary=:all: -r release/requirements.lock"
      - run: python scripts/stage_ffmpeg.py windows-x86_64
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Full candidate compatibility
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/validate_controlled_ffmpeg.py build/ffmpeg-controlled/prefix/bin build/ffmpeg-controlled/compatibility.json
      - run: python scripts/prepare_controlled_package_snapshot.py
      - run: python build/controlled-app-snapshot/scripts/install_packaging_tool.py
      - name: Frozen Windows candidate and installer smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python build/controlled-app-snapshot/scripts/build_release.py --candidate
      - name: Retain metadata only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: FFmpeg-Windows-bootstrap-${{ github.sha }}
          path: |
            build/ffmpeg-controlled/manifest.json
            build/ffmpeg-controlled/environment.json
            build/ffmpeg-controlled/packages.txt
            build/ffmpeg-controlled/logs/*.log
            build/ffmpeg-controlled/compatibility.json
            build/controlled-app-snapshot/dist/candidate/*.json
            build/controlled-app-snapshot/dist/candidate/*-SHA256SUMS.txt
          if-no-files-found: warn
  linux:
    if: inputs.target != 'windows'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.7'
      - name: Native build prerequisites (unapproved bootstrap)
        run: >-
          sudo apt-get update && sudo apt-get install -y autoconf automake libtool
          pkg-config cmake ninja-build meson libfontconfig1-dev libfreetype6-dev
          libfribidi-dev libharfbuzz-dev libva-dev zlib1g-dev libbz2-dev liblzma-dev
          bubblewrap libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 fonts-dejavu-core
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - run: python scripts/acquire_controlled_ffmpeg.py linux-x86_64
      - run: python scripts/build_controlled_ffmpeg.py linux-x86_64 --jobs 4 --environment-profile ubuntu-22.04-gcc
      - run: "python -m pip install --require-hashes --only-binary=:all: -r release/requirements.lock"
      - run: python scripts/stage_ffmpeg.py linux-x86_64
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python scripts/validate_controlled_ffmpeg.py build/ffmpeg-controlled/prefix/bin build/ffmpeg-controlled/compatibility.json
      - run: python scripts/prepare_controlled_package_snapshot.py
      - run: python build/controlled-app-snapshot/scripts/install_packaging_tool.py
      - run: python build/controlled-app-snapshot/scripts/build_release.py --candidate
      - name: Retain Linux metadata only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: FFmpeg-Linux-bootstrap-${{ github.sha }}
          path: |
            build/ffmpeg-controlled/manifest.json
            build/ffmpeg-controlled/environment.json
            build/ffmpeg-controlled/compatibility.json
            build/ffmpeg-controlled/logs/*.log
            build/controlled-app-snapshot/dist/candidate/*.json
            build/controlled-app-snapshot/dist/candidate/*-SHA256SUMS.txt
          if-no-files-found: warn
